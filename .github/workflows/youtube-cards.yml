name: YouTube Cards

on:
  schedule:
    # checks for new videos every hour
    - cron: "0 * * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: UCEu34nU4gy867u8Cy7obc6w
          max_videos: 6
          card_width: 250
          border_radius: 8
          max_title_lines: 2
          # mockingbird palette
          theme_context_dark: '{ "background_color": "#16232A", "title_color": "#D1EFF5", "stats_color": "#8CD4E6" }'
          theme_context_light: '{ "background_color": "#EAF7FA", "title_color": "#2E4F5B", "stats_color": "#547A88" }'
          commit_message: "chore(readme): update latest youtube videos"