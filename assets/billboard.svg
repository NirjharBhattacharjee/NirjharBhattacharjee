<svg xmlns="http://www.w3.org/2000/svg" width="560" height="64" viewBox="0 0 560 64" role="img" aria-label="IT + Data Science at Macquarie University · building mockingbird · free forever">
  <style>
    .panel { fill: #24273A; stroke: #494D64; stroke-width: 1; }
    .line {
      font: 600 17px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      fill: #CAD3F5;
      opacity: 0;
      animation: drop 12s cubic-bezier(.22, .9, .3, 1) infinite both;
    }
    .accent { fill: #C6A0F6; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    @keyframes drop {
      0%     { transform: translateY(-44px); opacity: 0; }
      5%     { transform: translateY(0);     opacity: 1; }
      28%    { transform: translateY(0);     opacity: 1; }
      33.33% { transform: translateY(44px);  opacity: 0; }
      100%   { transform: translateY(44px);  opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; }
      .l1 { opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="screen"><rect x="1" y="1" width="558" height="62" rx="14"/></clipPath>
  </defs>
  <rect class="panel" x="0.5" y="0.5" width="559" height="63" rx="14"/>
  <g clip-path="url(#screen)" text-anchor="middle">
    <text class="line l1" x="280" y="38">IT + <tspan class="accent">Data Science</tspan> @ Macquarie University</text>
    <text class="line l2" x="280" y="38">currently building <tspan class="accent">mockingbird</tspan></text>
    <text class="line l3" x="280" y="38">free to use · free to share · <tspan class="accent">free forever</tspan></text>
  </g>
</svg>
